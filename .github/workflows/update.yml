name: Update GTWC data

on:
  schedule:
    # Race weekends: Saturday and Sunday evening (UTC), plus a Monday morning
    # catch-up for post-race penalties. Runs with no new data change nothing.
    - cron: "30 21 * * 6,0"
    - cron: "30 5 * * 1"
  workflow_dispatch:   # lets you press "Run workflow" manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape standings and results
        run: python scripts/scrape.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update standings and results"
            git push
          else
            echo "No data changes."
          fi
