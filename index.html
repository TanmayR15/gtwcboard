<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GTWC Europe Pit Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181A;
    --panel: #212327;
    --panel-edge: #3B3E42;
    --ink: #EDEDED;
    --ink-muted: #8F9296;
    --ink-dim: #C7CACD;
    --shadow: #000000;
    --green: #4CDE6E;  --green-tint: #123420;
    --orange: #FF5A36; --orange-tint: #3A1810;
    --blue: #38B6FF;   --blue-tint: #10283A;
    --gold: #F2C94C;   --silver: #AEB8C4;  --bronze: #C98B4F;
    --bar-overall: #FFFFFF;
    --overall: #FF9F1C;
  }
  * { box-sizing: border-box; image-rendering: pixelated; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: 'VT323', monospace;
    background-image:
      linear-gradient(var(--panel-edge) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-edge) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
    background-attachment: fixed;
  }
  .pixel { font-family: 'Press Start 2P', monospace; }
  #app { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }

  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1.pixel { font-size: 16px; margin: 0; line-height: 1.5; color: #F2F2F2; text-shadow: 3px 3px 0 var(--shadow); }
  .subtitle { font-size: 18px; color: var(--ink-muted); margin-top: 6px; letter-spacing: 1px; }
  .updated { text-align: right; font-size: 15px; color: var(--ink-muted); max-width: 240px; }

  .toolbar { display: flex; gap: 10px; margin: 16px 0 18px; flex-wrap: wrap; }
  .tabrow { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .rowlabel { font-size: 15px; color: var(--ink-muted); letter-spacing: 1px; min-width: 64px; }

  .btn {
    font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 10px 12px;
    border: 3px solid var(--panel-edge); background: var(--panel); color: var(--ink-dim);
    cursor: pointer; box-shadow: 4px 4px 0 var(--shadow);
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
  .btn.active { border-color: var(--accent, var(--ink)); color: var(--accent, var(--ink)); background: var(--accent-tint, var(--panel-edge)); }
  .btn.main { border-color: var(--ink); color: var(--ink); }
  .btn.main.active { background: var(--panel-edge); }
  .btn.nav { padding: 10px 11px; }
  .btn:disabled { opacity: 0.3; cursor: default; box-shadow: none; transform: none; }

  .box { background: var(--panel); border: 3px solid var(--panel-edge); padding: 14px; box-shadow: 5px 5px 0 var(--shadow); margin-bottom: 18px; }
  .box-title.pixel { font-size: 11px; margin-bottom: 12px; display: block; color: #F2F2F2; line-height: 1.5; }

  table { width: 100%; border-collapse: collapse; font-size: 20px; }
  th { text-align: left; white-space: nowrap; font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--ink-muted); padding: 8px 6px; border-bottom: 3px solid var(--panel-edge); letter-spacing: 0.5px; }
  td { padding: 7px 6px; border-bottom: 2px solid var(--panel-edge); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; white-space: nowrap; padding-left: 12px; }
  td.pos { width: 44px; color: var(--ink-muted); }
  td.name { color: #F2F2F2; }
  td.sub { color: var(--ink-muted); font-size: 17px; }
  tr.p1 td.pos, tr.p1 td.num { color: var(--gold); }
  tr.p2 td.pos, tr.p2 td.num { color: var(--silver); }
  tr.p3 td.pos, tr.p3 td.num { color: var(--bronze); }
  .tablewrap { overflow-x: auto; }

  .empty { font-size: 19px; color: var(--ink-muted); padding: 10px 0; }
  .note { font-size: 15px; color: var(--ink-muted); margin-top: 10px; }
  .note.warn { color: var(--orange); margin: 0 0 10px; }
  select {
    font-family: 'VT323', monospace; font-size: 19px; padding: 7px 9px; max-width: 100%;
    border: 3px solid var(--panel-edge); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  select:focus { outline: none; border-color: #F2F2F2; }
  .search {
    font-family: 'VT323', monospace; font-size: 19px; padding: 7px 9px;
    flex: 1 1 220px; max-width: 360px;
    border: 3px solid var(--panel-edge); background: var(--panel); color: var(--ink);
  }
  .search::placeholder { color: var(--ink-muted); }

  /* compact control bar on the Standings page */
  .controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.sel { flex: 1 1 150px; }
  .field.grow { flex: 2 1 280px; min-width: 260px; }
  .flabel { font-size: 14px; color: var(--ink-muted); letter-spacing: 1px; }
  .controls select, .controls .search, .controls .btn { height: 44px; width: 100%; }
  .controls .search { max-width: none; flex: none; }
  .controls .btn { width: auto; padding: 0 14px; }
  .seg { display: flex; gap: 8px; }
  .search:focus { outline: none; border-color: #F2F2F2; }
  .err { border-color: var(--orange); color: var(--orange); }

  /* header, back button, clickable title */
  .header { align-items: center; }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .backbtn { font-family: 'Press Start 2P', monospace; font-size: 16px; width: 52px; height: 52px; flex: none;
    border: 3px solid var(--ink); background: var(--bg); color: var(--ink); cursor: pointer; box-shadow: 4px 4px 0 var(--shadow); }
  .backbtn:hover { border-color: var(--overall); color: var(--overall); }
  .backbtn:active { transform: translate(4px, 4px); box-shadow: none; }
  h1.pixel.link { cursor: pointer; }
  h1.pixel.link:hover { color: var(--overall); }

  /* home page */
  .flag { height: 16px; margin: -14px -14px 14px; border-bottom: 3px solid var(--panel-edge);
    background: repeating-conic-gradient(#EDEDED 0 25%, #17181A 0 50%) 0 0 / 16px 16px; }
  .hero { cursor: pointer; border-color: var(--overall); box-shadow: 6px 6px 0 var(--shadow); position: relative; overflow: hidden; }
  .hero:hover { background: #26282C; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .kicker { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--overall); letter-spacing: 1px; }
  .hero-name { font-family: 'Press Start 2P', monospace; font-size: 18px; line-height: 1.4; color: #F2F2F2; margin: 10px 0 4px; text-shadow: 3px 3px 0 var(--shadow); }
  .hero-sub { font-size: 20px; color: var(--ink-dim); }
  .car { width: 120px; height: auto; flex: none; animation: bob 1.2s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .count { display: flex; gap: 10px; margin: 16px 0 10px; flex-wrap: wrap; }
  .cell { min-width: 74px; text-align: center; background: var(--bg); border: 3px solid var(--panel-edge); padding: 10px 8px 8px; box-shadow: 3px 3px 0 var(--shadow); }
  .cell b { display: block; font-family: 'Press Start 2P', monospace; font-size: 20px; color: var(--overall); font-weight: normal; }
  .cell span { display: block; font-size: 14px; color: var(--ink-muted); margin-top: 6px; letter-spacing: 1px; }
  .hint { font-size: 17px; color: var(--ink-muted); margin-top: 6px; }
  .hint b { color: var(--overall); font-weight: normal; }
  @keyframes blink { 50% { opacity: 0.25; } }


  .cuptag { font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 0.5px; margin-left: 10px; white-space: nowrap; text-shadow: none; vertical-align: middle; }

  /* schedule page */
  .round { background: var(--panel); border: 3px solid var(--panel-edge); margin-bottom: 12px; box-shadow: 4px 4px 0 var(--shadow); }
  .round.next { border-color: var(--overall); }
  .round.done { opacity: 0.75; }
  .rhead { width: 100%; display: flex; align-items: center; gap: 12px; justify-content: space-between; text-align: left; cursor: pointer;
    background: transparent; border: 0; color: var(--ink); padding: 12px 14px; font-family: 'VT323', monospace; font-size: 21px; }
  .rhead .rn { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--ink-muted); display: block; margin-bottom: 6px; }
  .rhead .rt { color: #F2F2F2; font-size: 23px; }
  .rhead .rd { color: var(--ink-muted); font-size: 18px; }
  .badge { font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 7px 8px; border: 3px solid var(--panel-edge); color: var(--ink-muted); white-space: nowrap; }
  .badge.soon { border-color: var(--overall); color: var(--overall); }
  .badge.live { border-color: var(--green); color: var(--green); animation: blink 1s steps(2) infinite; }
  .sessions { padding: 0 14px 12px; border-top: 2px solid var(--panel-edge); }
  .dayhead { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--ink-muted); margin: 14px 0 6px; letter-spacing: 1px; }
  .srow { display: flex; gap: 12px; align-items: baseline; padding: 5px 0; border-bottom: 2px solid var(--panel-edge); font-size: 20px; }
  .srow:last-child { border-bottom: 0; }
  .stime { min-width: 118px; color: #F2F2F2; white-space: nowrap; }
  .sname { flex: 1; color: var(--ink-dim); }
  .skind { font-size: 15px; letter-spacing: 1px; }
  .k-race { color: var(--overall); } .k-qualifying { color: var(--blue); } .k-practice { color: var(--ink-muted); } .k-other { color: var(--ink-muted); }
  .srow.race .sname { color: #F2F2F2; }

  /* home style switcher */
  .styles { display: flex; align-items: center; gap: 8px; margin: -6px 0 16px; font-size: 15px; color: var(--ink-muted); letter-spacing: 1px; flex-wrap: wrap; }
  .styles .btn { padding: 7px 10px; }

  /* ===== home style 2: PADDOCK TOWER ===== */
  .h2grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 18px; align-items: start; }
  .h2grid .box { margin-bottom: 0; }
  .tower-row { position: relative; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 6px;
    background: var(--bg); border: 2px solid var(--panel-edge); overflow: hidden; }
  .tower-row .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #5A3A10, #2A1D0A); z-index: 0; }
  .tower-row > * { position: relative; z-index: 1; }
  .tower-pos { font-family: 'Press Start 2P', monospace; font-size: 10px; text-align: center; padding: 7px 0; background: var(--panel-edge); color: #F2F2F2; }
  .tower-row.p1 .tower-pos { background: var(--gold); color: #000; }
  .tower-row.p2 .tower-pos { background: var(--silver); color: #000; }
  .tower-row.p3 .tower-pos { background: var(--bronze); color: #000; }
  .tower-name { font-size: 21px; color: #F2F2F2; line-height: 1.1; }
  .tower-name small { display: block; font-size: 15px; color: var(--ink-muted); }
  .tower-pts { font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--overall); }
  .minicount { display: flex; gap: 8px; margin: 12px 0; }
  .minicount .cell { min-width: 62px; }
  .minicount .cell b { font-size: 16px; }
  .nextlist { margin-top: 10px; }
  .nextlist .srow { font-size: 19px; }
  .track { position: relative; margin: 34px 12px 8px; height: 8px; background: var(--panel-edge); }
  .track .done-line { position: absolute; left: 0; top: 0; bottom: 0; background: var(--overall); }
  .node { position: absolute; top: -8px; width: 24px; height: 24px; margin-left: -12px; background: var(--bg); border: 3px solid var(--panel-edge); cursor: pointer; padding: 0; }
  .node.done { background: var(--overall); border-color: var(--overall); }
  .node.now { border-color: var(--overall); }
  .node.sprint { box-shadow: 0 5px 0 var(--orange); } .node.endurance { box-shadow: 0 5px 0 var(--blue); }
  .nodelab { position: absolute; top: 24px; margin-left: -14px; width: 28px; text-align: center; font-size: 14px; color: var(--ink-muted); }
  .trackcar { position: absolute; top: -34px; margin-left: -22px; width: 44px; transition: left .4s steps(6); }
  .legend { font-size: 15px; color: var(--ink-muted); margin-top: 34px; display: flex; gap: 16px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 4px; margin-right: 6px; vertical-align: middle; }

  /* ===== home style 3: ARCADE TITLE SCREEN ===== */
  .arcade { text-align: center; padding: 22px 12px 18px; position: relative; overflow: hidden; cursor: pointer; border-color: var(--green); }
  .arcade::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px); }
  .arcade:hover { background: #26282C; }
  .a-kick { font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--green); letter-spacing: 2px; }
  .a-name { font-family: 'Press Start 2P', monospace; font-size: 22px; line-height: 1.5; color: #F2F2F2; margin: 14px 0 4px; text-shadow: 4px 4px 0 var(--shadow); }
  .a-sub { font-size: 21px; color: var(--ink-dim); }
  .lights { display: flex; justify-content: center; gap: 14px; margin: 20px 0 14px; }
  .light { width: 34px; height: 34px; border: 3px solid #000; background: #3A1010; box-shadow: inset 0 0 0 3px #240A0A; }
  .light.on { background: #FF2D2D; box-shadow: 0 0 14px #FF2D2D, inset 0 0 0 3px #FF7070; }
  .light.go { background: #4CDE6E; box-shadow: 0 0 14px #4CDE6E, inset 0 0 0 3px #A5F5B7; }
  .a-count { font-family: 'Press Start 2P', monospace; font-size: 24px; color: var(--overall); text-shadow: 3px 3px 0 var(--shadow); letter-spacing: 1px; }
  .a-count small { font-size: 10px; color: var(--ink-muted); margin: 0 10px 0 4px; letter-spacing: 0; }
  .a-start { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--green); margin-top: 18px; }
  .rtiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); gap: 10px; }
  .rtile { text-align: left; background: var(--bg); border: 3px solid var(--panel-edge); padding: 10px; cursor: pointer; color: var(--ink-dim);
    font-family: 'VT323', monospace; font-size: 19px; position: relative; border-top-width: 6px; }
  .rtile.sprint { border-top-color: var(--orange); } .rtile.endurance { border-top-color: var(--blue); }
  .rtile b { display: block; font-family: 'Press Start 2P', monospace; font-weight: normal; font-size: 8px; color: var(--ink-muted); margin-bottom: 6px; }
  .rtile.done { background: #1D1A12; color: var(--ink-muted); }
  .rtile.done::after { content: "\2713"; position: absolute; right: 8px; top: 8px; color: var(--overall); font-size: 20px; }
  .rtile.now { border-color: var(--green); color: #F2F2F2; animation: blink 1.2s steps(2) infinite; }
  .rtile:hover { background: var(--panel-edge); }
  .hs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
  .hs-row { display: flex; align-items: baseline; gap: 8px; font-size: 21px; padding: 3px 0; color: #F2F2F2; }
  .hs-row .r { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--ink-muted); min-width: 34px; }
  .hs-row:nth-child(2) .r { color: var(--gold); } .hs-row:nth-child(3) .r { color: var(--silver); } .hs-row:nth-child(4) .r { color: var(--bronze); }
  .hs-row .dots { flex: 1; border-bottom: 3px dotted var(--panel-edge); transform: translateY(-4px); min-width: 12px; }
  .hs-row .v { color: var(--overall); }
  .hs-title { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--green); margin-bottom: 8px; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- config ---------- */
const CUPS = [
  { key: "overall",   label: "OVERALL",        accent: "var(--ink)",    tint: "var(--panel-edge)", edge: "var(--overall)" },
  { key: "sprint",    label: "SPRINT CUP",     accent: "var(--orange)", tint: "var(--orange-tint)" },
  { key: "endurance", label: "ENDURANCE CUP",  accent: "var(--blue)",   tint: "var(--blue-tint)" },
];
// Class colours: white for overall, then gold / silver / bronze. The same colours
// drive the side bar of each table and the active state of the class buttons.
const CLASSES = [
  { key: "overall", label: "OVERALL", accent: "var(--bar-overall)", tint: "var(--panel-edge)", edge: "var(--overall)" },
  { key: "gold",    label: "GOLD",    accent: "var(--gold)",        tint: "#2A2410" },
  { key: "silver",  label: "SILVER",  accent: "var(--silver)",      tint: "#2A2B2D" },
  { key: "bronze",  label: "BRONZE",  accent: "var(--bronze)",      tint: "#2A1C10" },
];
const CLASS_STYLE = {   // race-result class names -> colours
  "all":        { accent: "var(--bar-overall)", tint: "var(--panel-edge)" },
  "pro cup":    { accent: "var(--bar-overall)", tint: "var(--panel-edge)" },
  "gold cup":   { accent: "var(--gold)",        tint: "#2A2410" },
  "silver cup": { accent: "var(--silver)",      tint: "#2A2B2D" },
  "bronze cup": { accent: "var(--bronze)",      tint: "#2A1C10" },
  "pro-am cup": { accent: "var(--blue)",        tint: "var(--blue-tint)" },
};
function classStyle(label) { return CLASS_STYLE[(label || "").toLowerCase()] || CLASS_STYLE["all"]; }
const ENTITIES = [
  { key: "drivers", label: "DRIVERS" },
  { key: "teams",   label: "TEAMS" },
];

const state = {
  page: "home",               // "home" | "standings" | "results" | "schedule"
  cup: "overall", cls: "overall", entity: "drivers",
  roundId: null, sessionId: null, resultClass: "ALL",
  stdQuery: "", resQuery: "",
  standings: null, results: null, error: null,
  teamByDriver: {}, homeStyle: 1, schedule: null, schedOpen: new Set(), timer: null,
};

/* ---------- helpers for names, sessions, classes ---------- */
function normName(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/\u00f8/g, "o").replace(/\u00e6/g, "ae").replace(/\u0153/g, "oe")
    .replace(/\u00df/g, "ss").replace(/\u0142/g, "l").replace(/\u0111/g, "d")
    .replace(/[^a-z0-9]+/g, " ").trim();
}
// Every word typed must appear somewhere in the searched fields (ignores capitals and accents).
function matchesQuery(query, ...fields) {
  const words = normName(query).split(" ").filter(Boolean);
  if (!words.length) return true;
  const hay = normName(fields.filter(Boolean).join(" "));
  return words.every((w) => hay.includes(w));
}
// Driver -> entry name from their most recent race result. Race results are the
// only place team names exist for drivers (the official driver standings omit them).
function buildTeamMap(results) {
  const map = {};
  const rounds = (results.rounds || []).slice().sort((a, b) => (a.round || 0) - (b.round || 0));
  rounds.forEach((round) => (round.sessions || []).forEach((sess) => (sess.rows || []).forEach((row) => {
    if (!row.team) return;
    (row.drivers || "").split(/,\s*/).forEach((d) => { const k = normName(d); if (k) map[k] = row.team; });
  })));
  return map;
}
// Interim snapshots of long races, e.g. "Main Race after 23h 30".
function isInterim(s) {
  const re = /after[\s-]+\d+\s*[h:\s-]\s*30/i;
  return re.test(s.name || "") || re.test(s.id || "");
}
// Points checkpoints at the 24 Hours of Spa, e.g. "Main Race after 6 hours".
function isCheckpoint(s) {
  return !isInterim(s) && /after[\s-]+\d+\s*(hours?|hrs?|h)\b/i.test((s.name || "") + " " + (s.id || ""));
}
// Opening choice for a round: its first race, preferring one called "Main Race".
function defaultSessionId(round) {
  const sessions = round.sessions || [];
  const finals = sessions.filter((s) => !isInterim(s) && !isCheckpoint(s));
  const main = finals.find((s) => /^main race$/i.test((s.name || "").trim()) || s.id === "main-race");
  const pick = main || finals[0] || sessions[0];
  return pick ? pick.id : null;
}
const CLASS_ORDER = ["pro cup", "pro-am cup", "gold cup", "silver cup", "bronze cup"];
function sortClasses(list) {
  const rank = (c) => { const i = CLASS_ORDER.indexOf(c.toLowerCase()); return i === -1 ? 99 : i; };
  return list.slice().sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
}

/* ---------- tiny DOM helper ---------- */
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k === "style") node.setAttribute("style", v);
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}
function fmtPoints(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

/* ---------- data loading ---------- */
async function loadData() {
  try {
    const [s, r] = await Promise.all([
      fetch("data/standings.json", { cache: "no-cache" }).then((x) => { if (!x.ok) throw new Error("standings.json " + x.status); return x.json(); }),
      fetch("data/results.json", { cache: "no-cache" }).then((x) => { if (!x.ok) throw new Error("results.json " + x.status); return x.json(); }),
    ]);
    state.standings = s;
    state.results = r;
    // The schedule is a bonus: the rest of the site still works without it.
    try {
      const sc = await fetch("data/schedule.json", { cache: "no-cache" });
      if (sc.ok) state.schedule = await sc.json();
    } catch (e) { state.schedule = null; }
    state.teamByDriver = buildTeamMap(r);
    const rounds = (r.rounds || []);
    if (rounds.length) {
      const last = rounds[rounds.length - 1];
      state.roundId = last.id;                           // latest round by default
      state.sessionId = defaultSessionId(last);          // its first race
    }
  } catch (err) {
    state.error = err.message;
  }
  render();
}

/* ---------- pieces ---------- */
function tabRow(label, items, activeKey, onPick, mainStyle) {
  const row = el("div", { class: "tabrow" }, [el("span", { class: "rowlabel", text: label })]);
  items.forEach((it) => {
    const active = it.key === activeKey;
    const cls = "btn" + (mainStyle ? " main" : "") + (active ? " active" : "");
    const style = it.accent ? `--accent:${it.accent}; --accent-tint:${it.tint}` : "";
    row.appendChild(el("button", { class: cls, style, text: it.label, onclick: () => onPick(it.key) }));
  });
  return row;
}

// The search box is created once per page draw and only the table below it is
// redrawn while typing, so the box keeps focus.
function searchRow(value, placeholder, onInput) {
  const inp = el("input", { type: "search", class: "search", placeholder, value: value || "", autocomplete: "off", spellcheck: "false", "aria-label": placeholder });
  inp.addEventListener("input", () => onInput(inp.value));
  return el("div", { class: "tabrow" }, [el("span", { class: "rowlabel", text: "SEARCH" }), inp]);
}

// Pieces of the Standings control bar: a label above each control.
function selectField(label, items, value, accent, onChange) {

  items.forEach((it) => {
    const o = el("option", { value: it.key, text: it.label });

  })));

}
function searchField(value, placeholder, onInput) {
  const inp = el("input", { type: "search", class: "search", placeholder, value: value || "", autocomplete: "off", spellcheck: "false", "aria-label": placeholder });
  inp.addEventListener("input", () => onInput(inp.value));

function renderResults() {
  const wrap = el("div");
  const rounds = state.results.rounds || [];
  if (rounds.length === 0) {
    wrap.appendChild(el("div", { class: "box" }, [el("div", { class: "empty", text: "No race results yet." })]));
    return wrap;
  }
  const round = rounds.find((r) => r.id === state.roundId) || rounds[rounds.length - 1];
  const sessions = round.sessions || [];
  const session = sessions.find((s) => s.id === state.sessionId)
    || sessions.find((s) => s.id === defaultSessionId(round)) || sessions[0];

  // ROUND dropdown
  const roundSel = el("select", { "aria-label": "Round", onchange: (e) => {
    state.roundId = e.target.value;
    const r = rounds.find((x) => x.id === state.roundId);
    state.sessionId = r ? defaultSessionId(r) : null;
    render();
  } });
  rounds.forEach((r) => {
    const o = el("option", { value: r.id, text: `R${r.round} ${r.name} (${r.cup})` });
    if (r.id === round.id) o.selected = true;
    roundSel.appendChild(o);
  });
  wrap.appendChild(el("div", { class: "tabrow" }, [el("span", { class: "rowlabel", text: "ROUND" }), roundSel]));

  if (!session) {
    wrap.appendChild(el("div", { class: "box" }, [el("div", { class: "empty", text: "No classification available for this round yet." })]));
    return wrap;
  }

  // RACE dropdown with previous / next, the same for every race format
  const idx = sessions.indexOf(session);
  const go = (i) => { state.sessionId = sessions[i].id; render(); };
  const raceSel = el("select", { "aria-label": "Race", onchange: (e) => { state.sessionId = e.target.value; render(); } });
  sessions.forEach((s) => {
    const o = el("option", { value: s.id, text: s.name + (isCheckpoint(s) ? " (points checkpoint)" : "") });
    if (s === session) o.selected = true;
    raceSel.appendChild(o);
  });
  const prev = el("button", { class: "btn nav", text: "<", "aria-label": "Previous race", onclick: () => go(idx - 1), ...(idx <= 0 ? { disabled: "" } : {}) });
  const next = el("button", { class: "btn nav", text: ">", "aria-label": "Next race", onclick: () => go(idx + 1), ...(idx >= sessions.length - 1 ? { disabled: "" } : {}) });
  wrap.appendChild(el("div", { class: "tabrow" }, [
    el("span", { class: "rowlabel", text: "RACE" }), prev, raceSel, next,
    el("span", { class: "rowlabel", style: "min-width:0", text: `${idx + 1}/${sessions.length}` }),
  ]));

  // CLASS buttons (the choice carries over when you change race, if that race has the class)
  const rows = session.rows || [];
  const classes = ["ALL", ...sortClasses(Array.from(new Set(rows.map((r) => (r.cls || "").trim()).filter(Boolean))))];
  const active = classes.includes(state.resultClass) ? state.resultClass : "ALL";
  if (classes.length > 1) {
    wrap.appendChild(tabRow("CLASS", classes.map((c) => ({ key: c, label: c.toUpperCase(), ...classStyle(c) })), active,
      (k) => { state.resultClass = k; render(); }));
  }

  const holder = el("div");
  const paint = () => {
    holder.innerHTML = "";
    const shown = rows.filter((r) => (active === "ALL" || (r.cls || "").trim() === active)
      && matchesQuery(state.resQuery, r.drivers, r.team, r.car, r.model));
    const tag = isInterim(session) ? " (interim)" : (isCheckpoint(session) ? " (points checkpoint)" : "");
    const box = el("div", { class: "box", style: `border-left:6px solid ${classStyle(active).accent}` });
    box.appendChild(el("span", { class: "box-title pixel", text: `${round.name} / ${session.name}${tag}`.toUpperCase() }));
    if (isInterim(session)) {
      box.appendChild(el("div", { class: "note warn", text: "Interim classification during the race, not the final result. The first race in the list is the final." }));
    } else if (isCheckpoint(session)) {
      box.appendChild(el("div", { class: "note warn", text: "Classification at a points checkpoint during the race, not the final result." }));
    }
    if (rows.length === 0) {
      box.appendChild(el("div", { class: "empty", text: "No classification available for this session yet." }));
    } else if (shown.length === 0) {
      box.appendChild(el("div", { class: "empty", text: "No cars match your search or class." }));
    } else {
      const head = el("tr", {}, [
        el("th", { text: "POS" }), el("th", { text: "#" }), el("th", { text: "DRIVERS" }),
        el("th", { text: "TEAM" }), el("th", { text: "CAR" }), el("th", { class: "num", text: "BEST LAP" }), el("th", { class: "num", text: "LAPS" }),
      ]);
      const body = el("tbody");
      shown.forEach((r, i) => {
        const pos = r.pos || i + 1;
        body.appendChild(el("tr", { class: pos <= 3 ? "p" + pos : "" }, [
          el("td", { class: "pos", text: String(pos) }),
          el("td", { class: "sub", text: r.car || "" }),
          el("td", { class: "name" }, (r.drivers || "").split(/,\s*/).filter(Boolean).map((d) => el("div", { text: d }))),
          el("td", { class: "sub", text: r.team || "" }),
          el("td", { class: "sub", text: r.model || "" }),
          el("td", { class: "num", text: r.time || "" }),
          el("td", { class: "num", text: r.laps != null ? String(r.laps) : "" }),
        ]));
      });
      box.appendChild(el("div", { class: "tablewrap" }, [el("table", {}, [el("thead", {}, [head]), body])]));
      if (state.resQuery.trim() || active !== "ALL") {
        box.appendChild(el("div", { class: "note", text: `Showing ${shown.length} of ${rows.length}. Positions are the official overall ones.` }));
      }
      box.appendChild(el("div", { class: "note", text: "BEST LAP is each car's fastest lap. The official table does not list total race times or gaps." }));
    }
    holder.appendChild(box);
  };

  wrap.appendChild(searchRow(state.resQuery, "SEARCH DRIVER, TEAM OR CAR", (q) => { state.resQuery = q; paint(); }));
  paint();
  wrap.appendChild(holder);
  return wrap;
}

/* ---------- time helpers (everything is shown in IST) ---------- */
const IST = "Asia/Kolkata";
// ?now=2026-10-10T12:00:00Z fakes the clock, handy for testing the countdown.
const FAKE_NOW = (() => { const v = new URLSearchParams(location.search).get("now"); const t = v ? Date.parse(v) : NaN; return isNaN(t) ? null : t; })();
const LOADED_AT = Date.now();
function nowMs() { return FAKE_NOW === null ? Date.now() : FAKE_NOW + (Date.now() - LOADED_AT); }
function istParts(ms, opts) {
  const o = {};
  new Intl.DateTimeFormat("en-GB", Object.assign({ timeZone: IST }, opts)).formatToParts(new Date(ms)).forEach((x) => { o[x.type] = x.value; });
  return o;
}
function istDateKey(ms) { const p = istParts(ms, { year: "numeric", month: "2-digit", day: "2-digit" }); return `${p.year}-${p.month}-${p.day}`; }
function istTime(ms) { const p = istParts(ms, { hour: "2-digit", minute: "2-digit", hour12: false }); return `${p.hour}:${p.minute}`; }
function istDayLabel(ms) {
  const p = istParts(ms, { weekday: "short", day: "2-digit", month: "short" });
  return `${p.weekday} ${p.day} ${p.month}`.toUpperCase();
}
function dayDiff(aMs, bMs) { return Math.round((Date.parse(istDateKey(aMs) + "T00:00:00Z") - Date.parse(istDateKey(bMs) + "T00:00:00Z")) / 864e5); }
function rangeLabel(r) {
  const a = Date.parse(r.start + "T12:00:00Z"), b = Date.parse(r.end + "T12:00:00Z");
  const pa = istParts(a, { day: "numeric", month: "short" }), pb = istParts(b, { day: "numeric", month: "short" });
  return (pa.month === pb.month ? `${pa.day}-${pb.day} ${pb.month}` : `${pa.day} ${pa.month} - ${pb.day} ${pb.month}`).toUpperCase();
}

/* ---------- schedule logic ---------- */
function sessionMs(x) { return Date.parse(x.utc); }
function roundStartMs(r) {
  const ss = r.sessions || [];
  return ss.length ? Math.min(...ss.map(sessionMs)) : Date.parse(r.start + "T00:00:00Z");
}
function roundEndMs(r) {
  const ss = r.sessions || [];
  if (!ss.length) return Date.parse(r.end + "T23:59:59Z");
  const last = Math.max(...ss.map((x) => (x.end_utc ? Date.parse(x.end_utc) : sessionMs(x))));
  return last + (/24 hours/i.test(r.name || "") ? 26 : 4) * 36e5;   // allow for the race itself
}
function roundStatus(r, now) {
  if (now > roundEndMs(r)) return "done";
  if (now >= roundStartMs(r)) return "live";
  return "upcoming";
}
// Sprint rounds have two races (Race 1 and Race 2); Endurance rounds have a single Main Race.
function roundCup(r) {
  const races = (r.sessions || []).filter((x) => x.kind === "race").length;
  if (races >= 2) return "sprint";
  if (races === 1) return "endurance";
  return "";
}
function cupTag(r) {
  const c = roundCup(r);
  if (!c) return null;
  const cup = CUPS.find((x) => x.key === c);
  return el("span", { class: "cuptag", style: `color:${cup.accent}`, text: "\u00b7 " + cup.label });
}
function scheduleRounds() { return ((state.schedule || {}).rounds || []).slice().sort((a, b) => a.round - b.round); }
function nextRound(now) { return scheduleRounds().find((r) => roundStatus(r, now) !== "done") || null; }
// What the big countdown counts down to: the next race session, else the next session, else the first day.
function countdownTarget(r, now) {
  const upcoming = (r.sessions || []).filter((x) => sessionMs(x) > now).sort((a, b) => sessionMs(a) - sessionMs(b));
  const race = upcoming.find((x) => x.kind === "race");
  if (race) return { ms: sessionMs(race), label: race.name.toUpperCase() };
  if (upcoming.length) return { ms: sessionMs(upcoming[0]), label: upcoming[0].name.toUpperCase() };
  if (now < roundStartMs(r)) return { ms: roundStartMs(r), label: "WEEKEND START" };
  return null;
}
function splitCountdown(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  return { d: Math.floor(t / 86400), h: Math.floor((t % 86400) / 3600), m: Math.floor((t % 3600) / 60), s: t % 60 };
}
function pad2(n) { return String(n).padStart(2, "0"); }

/* ---------- pixel car for the home page (drawn from a tiny grid) ---------- */
function pixelCar() {
  const rows = [
    "......oooooo........",
    ".....oowwwwoo.......",
    "....oowwwwwwoooo....",
    "ooooooooooooooooooo.",
    "ooooooooooooooooooo.",
    ".kkkk.ooooooo.kkkk..",
    ".kddk.........kddk..",
    ".kkkk.........kkkk..",
  ];
  const colour = { o: "#FF9F1C", w: "#38B6FF", k: "#000000", d: "#8F9296" };
  let rects = "";
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (colour[c]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colour[c]}"/>`; }));
  const wrap = document.createElement("div");
  wrap.innerHTML = `<svg class="car" viewBox="0 0 20 8" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
  return wrap.firstChild;
}

/* ---------- shared bits for the alternative home styles ---------- */
function shortRound(r) { return (r.name || "").replace(/^CrowdStrike 24 Hours of /i, "24H ").replace(/^Circuit /i, ""); }
function homeFacts() {
  const now = nowMs();
  const rounds = scheduleRounds();
  const nxt = nextRound(now);
  const tables = (state.standings || {}).tables || {};
  const all = (((tables.overall || {}).overall || {}));
  return { now, rounds, nxt, doneCount: rounds.filter((r) => roundStatus(r, now) === "done").length,
    target: nxt ? countdownTarget(nxt, now) : null, drivers: (all.drivers || []).slice(0, 6), teams: (all.teams || []).slice(0, 5) };
}
function noScheduleBox(wrap) {
  wrap.appendChild(el("div", { class: "box" }, [el("div", { class: "empty", text: "Schedule not loaded yet. It appears after the next scheduled update." })]));
}

/* ---------- home style 2: PADDOCK TOWER ---------- */

      style: `left:${i * step}%`, title: `Round ${r.round}: ${r.name}`, "aria-label": `Round ${r.round}: ${r.name}`, onclick: () => openSchedule(r.round) });
    track.appendChild(node);
    track.appendChild(el("div", { class: "nodelab", style: `left:${i * step}%`, text: String(r.round) }));
  });
  const car = pixelCar(); car.setAttribute("class", "car trackcar"); car.setAttribute("style", `left:${carAt}%`);
  track.appendChild(car);
  box.appendChild(track);
  box.appendChild(el("div", { class: "legend" }, [
    el("span", {}, [el("i", { style: "background:var(--orange)" }), "SPRINT CUP"]),
    el("span", {}, [el("i", { style: "background:var(--blue)" }), "ENDURANCE CUP"]),
    el("span", { text: "CLICK A ROUND FOR ITS SCHEDULE" }),
  ]));
  wrap.appendChild(box);
  return wrap;
}

/* ---------- home style 3: ARCADE TITLE SCREEN ---------- */
function renderHomeArcade() {
  const wrap = el("div");
  const f = homeFacts();

  const hero = el("div", { class: "box arcade", role: "button", tabindex: "0", onclick: () => openSchedule(f.nxt ? f.nxt.round : null) });
  if (!f.nxt) {
    hero.appendChild(el("div", { class: "a-kick", text: f.rounds.length ? "GAME OVER · SEASON COMPLETE" : "LOADING ROUND..." }));
    hero.appendChild(el("div", { class: "a-name", text: f.rounds.length ? "SEE YOU NEXT SEASON" : "SCHEDULE NOT LOADED YET" }));
  } else {
    hero.appendChild(el("div", { class: "a-kick", text: `ROUND ${f.nxt.round} OF ${f.rounds.length}` }));
    hero.appendChild(el("div", { class: "a-name" }, [f.nxt.name.toUpperCase(), cupTag(f.nxt)]));
    hero.appendChild(el("div", { class: "a-sub", text: `${f.nxt.country || ""} · ${rangeLabel(f.nxt)}` }));
    const lights = el("div", { class: "lights" });
    const bulbs = [0, 1, 2, 3, 4].map(() => el("div", { class: "light" }));
    bulbs.forEach((b) => lights.appendChild(b));
    hero.appendChild(lights);
    if (f.target) {
      const count = el("div", { class: "a-count" });
      hero.appendChild(count);
      hero.appendChild(el("div", { class: "hint", text: `${f.target.label} · ${istDayLabel(f.target.ms)} ${istTime(f.target.ms)} IST` }));
      const tick = () => {
        const left = f.target.ms - nowMs();
        const c = splitCountdown(left);
        count.innerHTML = "";
        [[c.d, "D"], [c.h, "H"], [c.m, "M"], [c.s, "S"]].forEach(([v, u]) => { count.appendChild(document.createTextNode(pad2(v))); count.appendChild(el("small", { text: u })); });
        // Start lights: one more red light every second, all green once the session begins.
        const on = left <= 0 ? 5 : (Math.floor(Date.now() / 1000) % 6);
        bulbs.forEach((b, i) => { b.className = "light" + (left <= 0 ? " go" : (i < on ? " on" : "")); });
      };
      tick(); state.timer = setInterval(tick, 1000);
    }
    hero.appendChild(el("div", { class: "a-start", text: "▶ PRESS START FOR THE SCHEDULE" }));
  }
  wrap.appendChild(hero);

  // Round select: one tile per round.
  if (f.rounds.length) {
    const box = el("div", { class: "box" }, [el("span", { class: "box-title pixel", text: `ROUND SELECT · ${f.doneCount} DONE` })]);
    const grid = el("div", { class: "rtiles" });
    f.rounds.forEach((r) => {
      const st = roundStatus(r, f.now);
      grid.appendChild(el("button", { class: `rtile ${roundCup(r)} ${st === "done" ? "done" : (f.nxt && f.nxt.round === r.round ? "now" : "")}`,
        onclick: () => openSchedule(r.round) }, [el("b", { text: `ROUND ${r.round}` }), shortRound(r)]));
    });
    box.appendChild(grid);
    box.appendChild(el("div", { class: "note", text: "ORANGE TOP EDGE = SPRINT CUP · BLUE TOP EDGE = ENDURANCE CUP · TICK = FINISHED" }));
    wrap.appendChild(box);
  } else noScheduleBox(wrap);

  // High scores: top drivers and teams.
  const hs = el("div", { class: "box" }, [el("span", { class: "box-title pixel", text: "HIGH SCORES" })]);
  const cols = el("div", { class: "hs" });
  const board = (title, rows) => {
    const c = el("div", {}, [el("div", { class: "hs-title", text: title })]);
    rows.forEach((x, i) => c.appendChild(el("div", { class: "hs-row" }, [
      el("span", { class: "r", text: ["1ST", "2ND", "3RD", "4TH", "5TH", "6TH"][i] }),
      el("span", { text: x.name.toUpperCase() }), el("span", { class: "dots" }), el("span", { class: "v", text: fmtPoints(x.total) }),
    ])));
    return c;
  };
  if (f.drivers.length) cols.appendChild(board("DRIVERS", f.drivers.slice(0, 5)));
  if (f.teams.length) cols.appendChild(board("TEAMS", f.teams.slice(0, 5)));
  if (cols.children.length) { hs.appendChild(cols); wrap.appendChild(hs); }
  return wrap;
}

function renderHome() { return [renderHomeArcade, renderHomePaddock][(state.homeStyle || 1) - 1](); }
function setHomeStyle(n) {
  state.homeStyle = n;
  try { localStorage.setItem("gtwcHome2", String(n)); } catch (e) { /* storage may be blocked */ }
  render();
}

/* ---------- schedule page ---------- */
function renderSchedule() {
  const wrap = el("div");
  const now = nowMs();
  const rounds = scheduleRounds();
  if (!rounds.length) {
    wrap.appendChild(el("div", { class: "box" }, [el("div", { class: "empty", text: "No schedule yet. It appears after the next scheduled update." })]));
    return wrap;
  }
  const nxt = nextRound(now);
  wrap.appendChild(el("div", { class: "note", text: "ALL TIMES ARE IN IST (INDIA STANDARD TIME, UTC+5:30)." }));
  rounds.forEach((r) => {
    const st = roundStatus(r, now);
    const open = state.schedOpen.has(r.round);
    const isNext = nxt && nxt.round === r.round;
    const box = el("div", { class: "round" + (isNext ? " next" : "") + (st === "done" ? " done" : ""), id: "round-" + r.round });

    let badge = el("span", { class: "badge", text: "DONE" });
    if (st === "live") badge = el("span", { class: "badge live", text: "LIVE NOW" });
    else if (st === "upcoming") {
      const n = dayDiff(roundStartMs(r), now);
      badge = el("span", { class: "badge soon", text: n <= 0 ? "TODAY" : (n === 1 ? "IN 1 DAY" : `IN ${n} DAYS`) });
    }
    box.appendChild(el("button", { class: "rhead", "aria-expanded": String(open), onclick: () => {
      if (state.schedOpen.has(r.round)) state.schedOpen.delete(r.round); else state.schedOpen.add(r.round);
      render();
    } }, [
      el("div", {}, [
        el("span", { class: "rn", text: `ROUND ${r.round}` + (isNext ? " · NEXT" : "") }),
        el("div", { class: "rt" }, [r.name, cupTag(r)]),
        el("div", { class: "rd", text: `${r.country || ""} · ${rangeLabel(r)}` }),
      ]),
      el("div", {}, [badge, el("span", { class: "rd", text: open ? "  ▲" : "  ▼" })]),
    ]));

    if (open) {
      const body = el("div", { class: "sessions" });
      const ss = (r.sessions || []).slice().sort((a, b) => sessionMs(a) - sessionMs(b));
      if (!ss.length) body.appendChild(el("div", { class: "empty", text: "Session times are not published yet." }));
      let lastDay = "";
      ss.forEach((x) => {
        const ms = sessionMs(x);
        const label = istDayLabel(ms);
        if (label !== lastDay) { body.appendChild(el("div", { class: "dayhead", text: label })); lastDay = label; }
        const when = istTime(ms) + (x.end_utc ? " - " + istTime(Date.parse(x.end_utc)) : "") + " IST";
        body.appendChild(el("div", { class: "srow" + (x.kind === "race" ? " race" : "") }, [
          el("span", { class: "stime", text: when }),
          el("span", { class: "sname", text: x.name }),
          el("span", { class: "skind k-" + (x.kind || "other"), text: (x.kind || "other").toUpperCase() }),
        ]));
      });
      box.appendChild(body);
    }
    wrap.appendChild(box);
  });
  return wrap;
}

/* ---------- navigation + page frame ---------- */
function go(page) { state.page = page; render(); window.scrollTo(0, 0); }
function openSchedule(roundNo) {
  if (roundNo != null) state.schedOpen.add(roundNo);
  else { const n = nextRound(nowMs()); if (n) state.schedOpen.add(n.round); }
  go("schedule");
  if (roundNo != null) { const node = document.getElementById("round-" + roundNo); if (node) node.scrollIntoView(); }
}

(function initHomeStyle() {
  let n = 0;
  try { n = parseInt(localStorage.getItem("gtwcHome2"), 10); } catch (e) { n = 0; }
  const q = parseInt(new URLSearchParams(location.search).get("home"), 10);
  state.homeStyle = [1, 2].includes(q) ? q : ([1, 2].includes(n) ? n : 1);
})();

function render() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  const app = document.getElementById("app");
  app.innerHTML = "";

  const updated = state.standings ? state.standings.updated : "";
  const onHome = state.page === "home";
  const title = el("h1", { class: "pixel link", text: "GTWC EUROPE PIT BOARD", title: "Home", tabindex: "0",
    onclick: () => go("home"), onkeydown: (e) => { if (e.key === "Enter") go("home"); } });
  app.appendChild(el("div", { class: "header" }, [
    el("div", { class: "brand" }, [
      onHome ? null : el("button", { class: "backbtn", text: "←", title: "Back to home", "aria-label": "Back to home", onclick: () => go("home") }),
      el("div", {}, [title, el("div", { class: "subtitle", text: "STANDINGS · RESULTS · SCHEDULE · 2026 SEASON" })]),
    ]),
    el("div", { class: "updated", text: updated ? "UPDATED: " + updated : "" }),
  ]));

  {
    app.appendChild(el("div", { class: "toolbar" }, [
      el("button", { class: "btn main" + (state.page === "standings" ? " active" : ""), text: "STANDINGS", onclick: () => go("standings") }),
      el("button", { class: "btn main" + (state.page === "results" ? " active" : ""), text: "RESULTS", onclick: () => go("results") }),
      el("button", { class: "btn main" + (state.page === "schedule" ? " active" : ""), text: "SCHEDULE", onclick: () => go("schedule") }),
    ]));
  }

  if (onHome && !state.error) {
    app.appendChild(el("div", { class: "styles" }, [el("span", { text: "HOME STYLE" })].concat([1, 2].map((n) =>
      el("button", { class: "btn main" + (state.homeStyle === n ? " active" : ""), text: String(n), title: "Home style " + n, onclick: () => setHomeStyle(n) })))));
  }

  if (state.error) {
    app.appendChild(el("div", { class: "box err" }, [
      el("div", { class: "empty err", text: "Could not load data (" + state.error + "). If you opened this file directly, run a local server instead: python -m http.server" }),
    ]));
    return;
  }
  if (!state.standings) {
    app.appendChild(el("div", { class: "empty", text: "Loading..." }));
    return;
  }
  const view = { home: renderHome, standings: renderStandings, results: renderResults, schedule: renderSchedule }[state.page];
  app.appendChild(view());
}

render();
loadData();
</script>
</body>
</html>
